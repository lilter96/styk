services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: styk
      POSTGRES_PASSWORD: styk_local
      POSTGRES_DB: styk
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - styk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styk -d styk"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  styk_pg:
