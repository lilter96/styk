name: Frontend verification
on:
  workflow_dispatch:
    inputs:
      contracts:
        description: Run product workspace database contracts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint
        working-directory: web
      - run: npm test -- --reporter=json --outputFile=test-results/unit.json
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: web/test-results/unit.json
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:ui
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: web/test-results

  contracts:
    if: inputs.contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: styk
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: styk_products_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U styk -d styk_products_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://styk:test_only@localhost:5432/styk_products_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test -race ./internal/matching ./internal/postgres ./internal/console ./internal/catalogsync
      - name: Migrate dedicated contract database
        run: go run -tags="no_mysql no_sqlite3 no_mssql no_ydb no_vertica no_clickhouse no_libsql" github.com/pressly/goose/v3/cmd/goose@v3.25.0 -dir migrations postgres "$TEST_DATABASE_URL" up
      - run: go test -race -tags=integration ./tests/integration -run 'Test(ProductDraft|ProductMatching|CatalogImport|MerchantActor|MerchantMutation|MappingConfirmation|DurableReview|Review|IdentitySessions)' -count=1
      - run: go test -race -tags=integration ./tests/integration -run '^TestProductMatchingBulkHotPath$' -count=1 -v
        env:
          STYK_MATCHING_PERFORMANCE: 'true'
