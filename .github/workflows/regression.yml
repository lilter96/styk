name: Full regression
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    # Dependency/browser installation is machine setup; verification below has
    # its own five-minute wall limit including the runner's cleanup reserve.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Image installation is setup. The verification runner owns PostgreSQL,
      # its connection/DDL-lock limits, companion DB and cancellation cleanup.
      - run: docker pull postgres:17.6
      - run: go run ./cmd/checks run --lane full
        timeout-minutes: 5
